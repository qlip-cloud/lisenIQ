{% macro iq_header(title='Título de Página') %}
<div class="page-header-container">
    <div class="d-flex align-items-center" style="width:100%;">
        <h1 class="h5 mb-0">{{ title }}</h1>
        <div id="iq-header-company-name" class="iq-header-company-name mx-auto">
            {{ frappe.session.data.liseniq_company_name or "" }}
        </div>
        <div class="d-flex align-items-center">
            <button id="btn-open-create-measurement-modal" class="btn btn-outline-purple btn-sm mr-4">+ Crear Medición</button>
            <i class="fa fa-bell-o text-muted mx-4" style="font-size: 1.2rem; cursor: pointer;"></i>
            <div class="user-menu-container position-relative">
                <img id="iq-header-avatar" src="/assets/liseniq/images/qlip_avatar.png" class="rounded-circle" style="width: 35px; height: 35px; cursor: pointer;">
                <div id="iq-header-user-menu" class="user-menu-dropdown d-none" style="position: absolute; top: 110%; right: 0; background: #fff; border: 1px solid #dee2e6; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); min-width: 140px; z-index: 100;">
                    <a href="#" id="iq-header-logout" class="dropdown-item" style="padding: 0.75rem 1.2rem; color: #212529; font-size: 0.9rem;">Salir</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endmacro %}
