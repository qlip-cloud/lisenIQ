<!-- listenaiq/www/liderazgo-dashboard.html -->
{% extends "templates/web.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_content %}

{% raw %}
<style>
#ll360{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;border-radius:12px;}
#ll360 *{box-sizing:border-box;}
#ll360{
  --purple:#6d28d9; --purple-dark:#4c1d95; --purple-light:#ede9fe;
  --teal:#0d9488; --teal-light:#ccfbf1; --blue:#2563eb;
  --bg:#f4f5f9; --card:#ffffff; --text:#1f2430; --text-sec:#6b7280; --border:#e5e7eb;
  --positive:#059669; --negative:#dc2626; --amber:#d97706;
  --radius:14px; --shadow:0 1px 3px rgba(17,24,39,.06), 0 1px 2px rgba(17,24,39,.04);
}
#ll360 .wrap{max-width:1320px;margin:0 auto;padding:20px;}
#ll360 .header{background:linear-gradient(120deg,var(--purple-dark),var(--purple) 65%,var(--teal));border-radius:var(--radius);padding:26px 30px;color:#fff;margin-bottom:18px;box-shadow:var(--shadow);}
#ll360 .header .eyebrow{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.8;font-weight:600;}
#ll360 .header h1{margin:6px 0 4px;font-size:26px;font-weight:700;}
#ll360 .header .sub{font-size:13.5px;opacity:.9;max-width:760px;line-height:1.5;}
#ll360 .header .meta{margin-top:14px;display:flex;gap:18px;flex-wrap:wrap;font-size:12px;opacity:.85;}
#ll360 .header .meta b{font-weight:600;opacity:1;}
#ll360 .header-actions{margin-top:16px;}
#ll360 .pdf-btn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12.5px;font-weight:700;padding:9px 18px;border-radius:9px;cursor:pointer;backdrop-filter:blur(2px);transition:.15s;}
#ll360 .pdf-btn:hover{background:rgba(255,255,255,.28);}
#ll360 .pdf-btn:disabled{opacity:.7;cursor:wait;}
#ll360 .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;}
#ll360 .tab-btn{border:1px solid var(--border);background:#fff;color:var(--text-sec);padding:9px 16px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;transition:.15s;white-space:nowrap;}
#ll360 .tab-btn:hover{border-color:var(--purple);color:var(--purple);}
#ll360 .tab-btn.active{background:var(--purple);border-color:var(--purple);color:#fff;}
#ll360 .tab-panel{display:none;}
#ll360 .tab-panel.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
#ll360 .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px;}
#ll360 .kpi-card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--border);}
#ll360 .kpi-label{font-size:11.5px;color:var(--text-sec);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-bottom:6px;}
#ll360 .kpi-value{font-size:26px;font-weight:800;color:var(--purple-dark);line-height:1;}
#ll360 .kpi-note{font-size:12px;color:var(--text-sec);margin-top:6px;}
#ll360 .grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;margin-bottom:16px;}
#ll360 .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px;}
@media(max-width:900px){#ll360 .grid2,#ll360 .grid3{grid-template-columns:1fr;}
}
#ll360 .card{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px;}
#ll360 .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
#ll360 .card-head h3{flex:1;}
#ll360 .dl-btn{flex-shrink:0;border:1px solid var(--border);background:#fafafa;color:var(--text-sec);font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:.15s;}
#ll360 .dl-btn:hover{border-color:var(--purple);color:var(--purple);background:var(--purple-light);}
#ll360 .dl-btn:active{transform:scale(.96);}
#ll360 .card h3{margin:0 0 3px;font-size:14.5px;font-weight:700;}
#ll360 .card .card-sub{font-size:12px;color:var(--text-sec);margin-bottom:14px;}
#ll360 .card canvas{max-height:320px;}
#ll360 .section-title{font-size:18px;font-weight:800;margin:4px 0 4px;color:var(--purple-dark);}
#ll360 .section-desc{font-size:13px;color:var(--text-sec);margin-bottom:16px;max-width:820px;}
#ll360 .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;}
#ll360 .pill.pos{background:#d1fae5;color:var(--positive);}
#ll360 .pill.neg{background:#fee2e2;color:var(--negative);}
#ll360 .pill.amber{background:#fef3c7;color:var(--amber);}
#ll360 .pill.purple{background:var(--purple-light);color:var(--purple-dark);}
#ll360 .pill.teal{background:var(--teal-light);color:#0f766e;}
#ll360 table{width:100%;border-collapse:collapse;font-size:12.8px;}
#ll360 th{text-align:left;padding:9px 10px;border-bottom:2px solid var(--border);color:var(--text-sec);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;user-select:none;white-space:nowrap;}
#ll360 th:hover{color:var(--purple);}
#ll360 td{padding:9px 10px;border-bottom:1px solid #f1f2f5;}
#ll360 tr:hover td{background:#faf9ff;}
#ll360 .table-wrap{overflow-x:auto;}
#ll360 .table-wrap.scroll-y{max-height:520px;overflow-y:auto;}
#ll360 .table-wrap.scroll-y thead th{position:sticky;top:0;background:#fff;z-index:2;}
#ll360 tr.group-row td{background:var(--purple-light);color:var(--purple-dark);font-weight:700;padding:8px 10px;border-top:2px solid #d8cdf5;}
#ll360 tr.group-row:hover td{background:var(--purple-light);}
#ll360 .rank-list{display:flex;flex-direction:column;gap:9px;}
#ll360 .rank-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;background:#fafafa;border:1px solid var(--border);}
#ll360 .rank-item .n{width:20px;height:20px;border-radius:50%;background:var(--purple);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
#ll360 .rank-item.low .n{background:var(--negative);}
#ll360 .rank-item .txt{flex:1;font-size:12.6px;}
#ll360 .rank-item .txt .main{font-weight:600;}
#ll360 .rank-item .txt .sub{color:var(--text-sec);font-size:11px;}
#ll360 .rank-item .score{font-weight:800;font-size:14px;}
#ll360 .filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
#ll360 .filter-bar select,#ll360 .filter-bar input{padding:7px 10px;border-radius:8px;border:1px solid var(--border);font-size:12.5px;background:#fff;color:var(--text);}
#ll360 .filter-bar label{font-size:12px;color:var(--text-sec);font-weight:600;}
#ll360 .msel{display:flex;flex-wrap:wrap;gap:6px;max-width:460px;}
#ll360 .msel-chip{border:1px solid var(--border);background:#fafafa;color:var(--text-sec);font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;cursor:pointer;user-select:none;transition:.15s;}
#ll360 .msel-chip.on{background:var(--purple);border-color:var(--purple);color:#fff;}
#ll360 .insight{border-left:4px solid var(--purple);background:var(--purple-light);border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.55;margin-bottom:10px;}
#ll360 .insight.teal{border-left-color:var(--teal);background:var(--teal-light);}
#ll360 .insight.amber{border-left-color:var(--amber);background:#fffbeb;}
#ll360 .insight b{color:var(--purple-dark);}
#ll360 .word-cloud{display:flex;flex-wrap:wrap;gap:8px;}
#ll360 .word-tag{background:var(--purple-light);color:var(--purple-dark);padding:5px 12px;border-radius:999px;font-weight:600;}
#ll360 .quad-wrap{position:relative;height:420px;}
#ll360 .legend-scale{display:flex;gap:14px;font-size:11.5px;color:var(--text-sec);margin-top:8px;flex-wrap:wrap;}
#ll360 .legend-scale span{display:flex;align-items:center;gap:5px;}
#ll360 .legend-scale i{width:10px;height:10px;border-radius:3px;display:inline-block;}
#ll360 .gloss-cat-title{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--purple-dark);font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:9px;}
#ll360 .gloss-cat-title::before{content:'';width:20px;height:3px;background:linear-gradient(90deg,var(--purple),var(--teal));border-radius:2px;display:inline-block;}
#ll360 .gloss-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-bottom:8px;}
#ll360 .gloss-card{background:#fafafa;border:1px solid var(--border);border-left:3px solid var(--purple);border-radius:10px;padding:13px 15px;transition:.15s;}
#ll360 .gloss-card:hover{background:#fff;box-shadow:var(--shadow);border-left-color:var(--teal);}
#ll360 .gloss-term{font-weight:700;color:var(--purple-dark);font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:7px;}
#ll360 .gloss-def{font-size:12.3px;color:var(--text);line-height:1.55;}
#ll360 .gloss-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;display:inline-block;}
#ll360 .dim-group-title{margin:22px 0 12px;padding:10px 16px;border-radius:10px;background:linear-gradient(90deg,var(--purple-dark),var(--purple));color:#fff;font-size:14px;font-weight:800;letter-spacing:.2px;}
#ll360 .dim-group-title span{font-weight:500;opacity:.85;font-size:12px;margin-left:4px;}
body.pdf-export #ll360 .dl-btn{visibility:hidden !important;}
#ll360 .footer{text-align:center;font-size:11.5px;color:var(--text-sec);padding:22px 0 10px;}
#ll360 .empty-note{color:var(--text-sec);font-size:12.5px;font-style:italic;padding:8px 0;}


#ll360 .ll-state{padding:60px 20px;text-align:center;color:var(--text-sec);font-size:14px;}
#ll360 .ll-state.error{color:var(--negative);}
</style>

<div id="ll360">
  <div class="ll-state" id="ll-state">Cargando dashboard…</div>
  <div id="ll-app" style="display:none">
<div class="wrap">
  <div class="header">
    <div class="eyebrow">Informe Confidencial</div>
    <h1>Dashboard Organizacional de Liderazgo 360°</h1>
    <div class="sub" id="m-sub"></div>
    <div class="meta">
      <span><b id="m-lideres"></b> líderes evaluados</span>
      <span><b id="m-evaluadores"></b> evaluadores</span>
      <span><b id="m-respuestas"></b> respuestas analizadas</span>
      <span>Escala <b id="m-escala-min"></b> – <b id="m-escala-max"></b></span>
    </div>
    <div class="header-actions">
      <button class="pdf-btn" id="btn-download-pdf" onclick="generateFullPdf()">⬇ Descargar dashboard completo en PDF</button>
    </div>
  </div>
  <div class="tabs" id="tabs"></div>
  <div id="panels"></div>
  <div class="footer" id="m-footer"></div>
</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pako@1.0.11/dist/pako.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/upng-js@2.1.0/UPNG.js"></script>
<script>
(function(){
  var API = '/api/method/liseniq.api.leadership_dashboard.get_dashboard_data';
  var SURVEY = new URLSearchParams(window.location.search).get('survey') || window.LL_SURVEY;
  var state = document.getElementById('ll-state');
  function fail(msg){ state.className = 'll-state error'; state.textContent = msg; }
  if(!SURVEY){ fail('Falta el parámetro "survey" en la URL.'); return; }

  function boot(DATA){

// ============ Palette & chart helpers ============
const COLORS = {
  purple:'#6d28d9', purpleDark:'#4c1d95', purpleSoft:'#c4b5fd',
  teal:'#0d9488', amber:'#d97706', red:'#dc2626', green:'#059669', blue:'#2563eb',
  heatRed:'#fecaca', heatAmber:'#fde68a', heatLightGreen:'#bbf7d0', heatDarkGreen:'#4ade80',
  grid:'#eceef2', text:'#6b7280'
};
Chart.defaults.font.family = "-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif";
Chart.defaults.color = COLORS.text;
Chart.defaults.font.size = 11.5;
if(window.ChartDataLabels){ Chart.register(ChartDataLabels); }
Chart.defaults.set('plugins.datalabels', { display:false });

function barLabels(opts){
  return Object.assign({ display:true, color:'#3a2a5c', font:{weight:'700', size:10.5},
    formatter:(v)=> typeof v==='number' ? v.toFixed(2) : v }, opts||{});
}
function heatBarColor(v){
  if(v==null) return '#e5e7eb';
  if(v>=4.6) return COLORS.heatDarkGreen;
  if(v>=4.4) return COLORS.heatLightGreen;
  if(v>=4.0) return COLORS.heatAmber;
  return COLORS.heatRed;
}
function fmt(v){ return (v===null||v===undefined) ? '–' : Number(v).toFixed(2); }
function pill(brecha){
  if(brecha==null) return '<span class="pill purple">–</span>';
  const cls = brecha>0.2 ? 'amber' : (brecha>0.35?'neg':'pos');
  const sign = brecha>=0?'+':'';
  return `<span class="pill ${cls}">${sign}${fmt(brecha)}</span>`;
}
function nivel(score){
  // Alineado exactamente con las bandas del mapa de calor (heatBarColor):
  // en una escala 1–5, equivalen a 4.6 / 4.4 / 4.0 — aquí expresadas como
  // fracción del rango de la escala para que ambos usen el mismo corte.
  if(score==null) return {label:'Sin datos', cls:'purple'};
  const {min,max} = DATA.escala;
  const span = max-min;
  if(score>=min+span*0.90) return {label:'Excepcional', cls:'pos'};
  if(score>=min+span*0.85) return {label:'Sólido', cls:'purple'};
  if(score>=min+span*0.75) return {label:'En desarrollo', cls:'amber'};
  return {label:'Prioritario', cls:'neg'};
}
function heatCell(v){ return `<td style="background:${heatBarColor(v)};font-weight:700;text-align:center;">${fmt(v)}</td>`; }
function slugify(s){
  return s.toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}
function dlBtn(targetId, filename){
  return `<button class="dl-btn" onclick="downloadAsJpeg('${targetId}','${filename}')" title="Descargar como imagen JPEG">⬇ JPEG</button>`;
}
async function downloadAsJpeg(elementId, filename){
  const el = document.getElementById(elementId);
  if(!el || !window.html2canvas) return;
  const btns = el.querySelectorAll('.dl-btn');
  btns.forEach(b=> b.style.visibility='hidden');
  try{
    const canvas = await html2canvas(el, {backgroundColor:'#ffffff', scale:2, useCORS:true});
    const link = document.createElement('a');
    link.download = (filename||'dashboard') + '.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.92);
    link.click();
  } finally { btns.forEach(b=> b.style.visibility=''); }
}

// ============ Header KPIs ============
document.getElementById('m-lideres').textContent = DATA.kpis.n_lideres;
document.getElementById('m-evaluadores').textContent = DATA.kpis.n_evaluadores;
document.getElementById('m-respuestas').textContent = DATA.kpis.n_respuestas.toLocaleString('es-CO');
document.getElementById('m-escala-min').textContent = DATA.escala.min;
document.getElementById('m-escala-max').textContent = DATA.escala.max;

// ============ Tabs (built dynamically from data shape) ============
const HAS_DEMO = (DATA.demographic_fields || []).length > 0;
const TABS = [
  {id:'resumen', label:'Resumen Ejecutivo'},
  {id:'dimensiones', label:'Dimensiones'},
  {id:'competencias', label:'Competencias'},
  {id:'comportamientos', label:'Comportamientos'},
  {id:'perspectiva', label:'Perspectiva 360°'},
  {id:'brechas', label:'Brechas y Consenso'},
];
if(HAS_DEMO) TABS.push({id:'demografico', label:'Demográfico'});
TABS.push({id:'insights', label:'Insights y Prioridades'});
TABS.push({id:'glosario', label:'Glosario'});

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');
TABS.forEach((t,i)=>{
  const btn = document.createElement('button');
  btn.className = 'tab-btn' + (i===0?' active':'');
  btn.textContent = t.label;
  btn.onclick = ()=> activateTab(t.id);
  btn.dataset.tab = t.id;
  tabsEl.appendChild(btn);
  const panel = document.createElement('div');
  panel.className = 'tab-panel' + (i===0?' active':'');
  panel.id = 'panel-' + t.id;
  panelsEl.appendChild(panel);
});

const rendered = new Set();
function activateTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===id));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
  if(!rendered.has(id)){ RENDERERS[id](); rendered.add(id); }
}
const RENDERERS = {
  resumen: renderResumen, dimensiones: renderDimensiones, competencias: renderCompetencias,
  comportamientos: renderComportamientos, perspectiva: renderPerspectiva, brechas: renderBrechas,
  insights: renderInsights, glosario: renderGlosario,
};
if(HAS_DEMO) RENDERERS.demografico = renderDemografico;

activateTab('resumen');

// ================= RESUMEN EJECUTIVO =================
function renderResumen(){
  const k = DATA.kpis;
  const lvl = nivel(k.puntaje_otros);
  const nDim = DATA.dimensiones.length;
  const topFortalezas = DATA.behav_top5 || [];
  const topOportunidades = DATA.behav_bottom5 || [];
  const mejorDim = DATA.dimensiones[0];
  const peorDim = DATA.dimensiones[DATA.dimensiones.length-1];
  const peorComp = DATA.top_oportunidades_comp[0];

  const html = `
    <div class="section-title">Resumen Ejecutivo</div>
    <div class="section-desc">Estado general del liderazgo en ${DATA.meta.cliente} — pensado para leerse en menos de 2 minutos.</div>

    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Líderes evaluados</div><div class="kpi-value">${k.n_lideres}</div><div class="kpi-note">${k.n_evaluaciones} relaciones evaluador–líder</div></div>
      <div class="kpi-card"><div class="kpi-label">Evaluadores únicos</div><div class="kpi-value">${k.n_evaluadores}</div><div class="kpi-note">Jefe, Pares y Colaboradores</div></div>
      <div class="kpi-card"><div class="kpi-label">Respuestas totales</div><div class="kpi-value">${k.n_respuestas.toLocaleString('es-CO')}</div><div class="kpi-note">${DATA.comportamientos.length} comportamientos × ${DATA.competencias.length} competencias</div></div>
      <div class="kpi-card"><div class="kpi-label">Resultado global (Otros)</div><div class="kpi-value">${fmt(k.puntaje_otros)}<span class="pill ${lvl.cls}" style="margin-left:8px;font-size:11px;vertical-align:middle;">${lvl.label}</span></div><div class="kpi-note">Autoevaluación: ${fmt(k.puntaje_auto)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Brecha Auto vs. Otros</div><div class="kpi-value">${k.brecha_global>0?'+':''}${fmt(k.brecha_global)}</div><div class="kpi-note">${k.brecha_global>0 ? 'Los líderes se autoevalúan por encima de la percepción de su entorno' : 'Los líderes se autoevalúan por debajo de la percepción de su entorno'}</div></div>
    </div>

    <div class="card" id="card-resumen-dimbar">
      <div class="card-head"><h3>Comparación de dimensiones — Auto vs. Otros</h3>${dlBtn('card-resumen-dimbar','resumen_dimensiones')}</div>
      <div class="card-sub">${nDim>1 ? `Promedio organizacional en las ${nDim} dimensiones del modelo de liderazgo` : 'Promedio organizacional de la dimensión evaluada por este modelo'}</div>
      <canvas id="chart-resumen-dim-bar" style="max-height:320px"></canvas>
    </div>

    <div class="card">
      <h3>Cómo leer los mapas de calor de este dashboard</h3>
      <div class="card-sub">Escala de color usada en las tablas y gráficos de "Dimensiones", "Competencias", "Comportamientos" y "Perspectiva 360°" para ubicar rápidamente puntajes altos y bajos</div>
      <div class="legend-scale" style="font-size:13px;">
        <span><i style="background:#fecaca"></i><b>&lt; 4.0</b> — Requiere atención</span>
        <span><i style="background:#fde68a"></i><b>4.0 – 4.4</b> — En desarrollo</span>
        <span><i style="background:#bbf7d0"></i><b>4.4 – 4.6</b> — Sólido</span>
        <span><i style="background:#4ade80"></i><b>&gt; 4.6</b> — Excepcional</span>
      </div>
    </div>

    <div class="grid3">
      <div class="card" id="card-resumen-top">
        <div class="card-head"><h3>Top ${topFortalezas.length} fortalezas</h3>${dlBtn('card-resumen-top','resumen_top_fortalezas')}</div>
        <div class="card-sub">Comportamientos mejor valorados por el entorno (de ${DATA.comportamientos.length} evaluados)</div>
        <div class="rank-list">
          ${topFortalezas.map((c,i)=>`<div class="rank-item"><div class="n">${i+1}</div>
            <div class="txt"><div class="main">${c.comportamiento}</div><div class="sub">${c.competencia}</div></div>
            <div class="score" style="color:var(--positive)">${fmt(c.otros)}</div></div>`).join('') || '<div class="empty-note">Sin datos suficientes.</div>'}
        </div>
      </div>

function dimCard(d, isTop){

  return `<div class="rank-item ${isTop?'':'low'}" style="background:#fff;">
    <div class="txt"><div class="main">${d.tema}</div><div class="sub">Jefe ${fmt(d.jefe)} · Par ${fmt(d.par)} · Colab. ${fmt(d.colaborador)}</div></div>

// Orden de presentación de dimensiones: primero las del modelo DML en su orden natural
// (Dirección, Movilización, Logro); cualquier otra dimensión (p. ej. "Como persona" o las
// de un modelo a la medida) va después, ordenada por puntaje "Otros".
const DIM_CANON_ORDER = ['direccion','movilizacion','logro'];
function _norm(x){ return (x||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim(); }
function dimRank(tema){
  const i = DIM_CANON_ORDER.indexOf(_norm(tema));
  if(i>=0) return i;
  const extra = [...DATA.dimensiones].filter(d=>DIM_CANON_ORDER.indexOf(_norm(d.tema))<0)
    .sort((a,b)=>(b.otros||0)-(a.otros||0)).map(d=>d.tema);
  return DIM_CANON_ORDER.length + Math.max(0, extra.indexOf(tema));
}
function sortByDimension(arr){
  return [...arr].sort((a,b)=> dimRank(a.tema)-dimRank(b.tema) || (b.otros||0)-(a.otros||0));
}

// ================= sortable tables =================
function makeSortable(tableId){
  const table = document.getElementById(tableId);
  if(!table) return;
  const ths = table.querySelectorAll('th');
  ths.forEach((th, colIdx)=>{
    th.addEventListener('click', ()=>{
      const tbody = table.querySelector('tbody');
      const rows = Array.from(tbody.querySelectorAll('tr'));
      const asc = th.dataset.asc !== 'true';
      ths.forEach(t=>delete t.dataset.asc);
      th.dataset.asc = asc;
      rows.sort((a,b)=>{
        let x = a.children[colIdx].innerText.replace('+','').trim();
        let y = b.children[colIdx].innerText.replace('+','').trim();
        const nx = parseFloat(x), ny = parseFloat(y);
        if(!isNaN(nx) && !isNaN(ny)) return asc ? nx-ny : ny-nx;
        return asc ? x.localeCompare(y) : y.localeCompare(x);
      });
      rows.forEach(r=>tbody.appendChild(r));
    });
  });
}

function flattenPdfBlocks(panel){
  const out = [];
  Array.from(panel.children).forEach(child=>{
    const isKnownBlock = ['card','grid2','grid3','kpi-row','insight','section-title','section-desc'].some(c=>child.classList.contains(c));
    if(!isKnownBlock && child.children.length>0 && Array.from(child.children).every(c=>c.classList.contains('card') || c.classList.contains('dim-group-title'))){
      Array.from(child.children).forEach(c=> out.push(c));
    } else {
      out.push(child);
    }
  });
  return out;
}
// Inserta un canvas en el PDF.
// Por defecto usa PNG cuantizado a 256 colores (UPNG): las tablas, textos y gráficos del dashboard
// son colores planos, así que queda más nítido que un JPEG (sin halos en el texto) y pesa mucho menos.
// Si las librerías no cargaron, usa JPEG como respaldo.
const PDF_IMG = { fmt:'PNG8', scale:1.6 };
function addCanvasToPdf(pdf, canvas, x, y, w, h, quality){
  if(PDF_IMG.fmt === 'PNG8' && window.UPNG && window.pako){
    const ctx = canvas.getContext('2d');
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const png = new Uint8Array(UPNG.encode([img.data.buffer], canvas.width, canvas.height, 256));
    pdf.addImage(png, 'PNG', x, y, w, h, undefined, 'FAST');
  } else if(PDF_IMG.fmt === 'PNG'){
    pdf.addImage(canvas.toDataURL('image/png'), 'PNG', x, y, w, h, undefined, 'FAST');
  } else {
    pdf.addImage(canvas.toDataURL('image/jpeg', quality || 0.82), 'JPEG', x, y, w, h);
  }
}
function placeCanvasFit(pdf, canvas, cursorY, cfg, quality){
  const {marginX, marginY, contentW, contentH} = cfg;
  const mmPerPx = contentW / canvas.width;
  let hMM = canvas.height * mmPerPx, wMM = contentW, xOff = marginX;
  if(hMM > contentH - 1){
    const f = (contentH - 1) / hMM;
    hMM = contentH - 1; wMM = contentW * f; xOff = marginX + (contentW - wMM) / 2;
  }
  // Si por poco no cabe en lo que queda de la página (≤14% de reducción), se ajusta el tamaño
  // en vez de dejar una página casi vacía con una sola tarjeta.
  const remaining = marginY + contentH - cursorY;
  if(cursorY > marginY + 1 && hMM > remaining && remaining / hMM >= 0.86){
    const f2 = remaining / hMM; hMM = remaining; wMM = wMM * f2; xOff = marginX;
  }
  if(cursorY + hMM > marginY + contentH + 0.01){ pdf.addPage(); cursorY = marginY; }
  addCanvasToPdf(pdf, canvas, xOff, cursorY, wMM, hMM, quality);
  return cursorY + hMM + 5;
}
async function renderGenericBlockToPdf(pdf, el, cfg, cursorY){
  const canvas = await html2canvas(el, {scale:PDF_IMG.scale, backgroundColor:'#ffffff', useCORS:true});
  return placeCanvasFit(pdf, canvas, cursorY, cfg, 0.82);
}
async function renderTableBlockToPdf(pdf, cardEl, table, cfg, cursorY){
  const {marginX, marginY, contentW, contentH} = cfg;
  const wrap = cardEl.querySelector('.table-wrap.scroll-y');
  let prevMaxHeight, prevOverflow;
  if(wrap){ prevMaxHeight = wrap.style.maxHeight; prevOverflow = wrap.style.overflowY; wrap.style.maxHeight='none'; wrap.style.overflowY='visible'; }

  // Si la tarjeta completa (título + tabla) cabe en una página, se captura entera y se mueve
  // a la página siguiente si no cabe en el espacio restante: nunca se corta ni se separa del título.
  const fullCanvas = await html2canvas(cardEl, {scale:PDF_IMG.scale, backgroundColor:'#ffffff', useCORS:true});
  const fullHmm = fullCanvas.height * (contentW / fullCanvas.width);
  if(fullHmm <= contentH - 1){
    if(wrap){ wrap.style.maxHeight = prevMaxHeight; wrap.style.overflowY = prevOverflow; }
    return placeCanvasFit(pdf, fullCanvas, cursorY, cfg, 0.85);
  }

  // Tabla más alta que una página: se parte SOLO entre filas, con el encabezado repetido
  const wrapEl = cardEl.querySelector('.table-wrap');
  const prevDisplay = wrapEl.style.display;
  wrapEl.style.display = 'none';
  const headerCanvas = await html2canvas(cardEl, {scale:PDF_IMG.scale, backgroundColor:'#ffffff', useCORS:true});
  wrapEl.style.display = prevDisplay;
  cursorY = placeCanvasFit(pdf, headerCanvas, cursorY, cfg, 0.85);

  const tableScale = PDF_IMG.scale;
  const tableCanvas = await html2canvas(table, {scale:tableScale, backgroundColor:'#ffffff', useCORS:true});
  const mmPerPx = contentW / tableCanvas.width;

  const trs = Array.from(table.querySelectorAll('tr'));
  const tableRect = table.getBoundingClientRect();
  const rowBoundaries = trs.map(tr=>{
    const r = tr.getBoundingClientRect();
    return { top:(r.top - tableRect.top) * tableScale, bottom:(r.bottom - tableRect.top) * tableScale };
  });
  const theadRowCount = table.tHead ? table.tHead.rows.length : 0;
  const headerHeightPx = theadRowCount > 0 ? rowBoundaries[theadRowCount - 1].bottom : 0;

  let cutStart = 0, isFirstSlice = true, guard = 0;
  while(cutStart < tableCanvas.height - 1 && guard < 500){
    guard++;
    const availableMM = isFirstSlice ? (marginY + contentH - cursorY) : contentH;
    const repeatsHeader = (cutStart >= headerHeightPx && headerHeightPx > 0);
    const availablePx = Math.max(availableMM, 10) / mmPerPx - (repeatsHeader ? headerHeightPx : 0);
    let sliceEnd = cutStart;
    for(const rb of rowBoundaries){ if(rb.bottom <= cutStart + availablePx && rb.bottom > cutStart) sliceEnd = rb.bottom; }
    if(sliceEnd <= cutStart || (cutStart === 0 && sliceEnd <= headerHeightPx)){
      if(isFirstSlice && cursorY > marginY + 1){ pdf.addPage(); cursorY = marginY; continue; }
      const nextRow = rowBoundaries.find(rb=>rb.bottom > Math.max(cutStart, headerHeightPx));
      sliceEnd = nextRow ? nextRow.bottom : tableCanvas.height;
    }
    let sliceCanvas;
    if(cutStart >= headerHeightPx && headerHeightPx > 0){
      sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = tableCanvas.width; sliceCanvas.height = headerHeightPx + (sliceEnd - cutStart);
      const ctx = sliceCanvas.getContext('2d');
      ctx.drawImage(tableCanvas, 0,0, tableCanvas.width, headerHeightPx, 0,0, tableCanvas.width, headerHeightPx);
      ctx.drawImage(tableCanvas, 0,cutStart, tableCanvas.width, sliceEnd-cutStart, 0, headerHeightPx, tableCanvas.width, sliceEnd-cutStart);
    } else {
      sliceCanvas = document.createElement('canvas');
      sliceCanvas.width = tableCanvas.width; sliceCanvas.height = sliceEnd - cutStart;
      const ctx = sliceCanvas.getContext('2d');
      ctx.drawImage(tableCanvas, 0,cutStart, tableCanvas.width, sliceEnd-cutStart, 0,0, tableCanvas.width, sliceEnd-cutStart);
    }
    const sliceHmm = sliceCanvas.height * mmPerPx;
    if(!isFirstSlice || cursorY + sliceHmm > marginY + contentH){ pdf.addPage(); cursorY = marginY; }
    addCanvasToPdf(pdf, sliceCanvas, marginX, cursorY, contentW, sliceHmm, 0.82);
    cursorY += sliceHmm + 5; cutStart = sliceEnd; isFirstSlice = false;
  }
  if(wrap){ wrap.style.maxHeight = prevMaxHeight; wrap.style.overflowY = prevOverflow; }
  return cursorY;
}
function drawCoverPage(pdf){
  const pageW = 297, pageH = 210;
  const k = DATA.kpis;
  pdf.setFillColor(76,29,149); pdf.rect(0, 0, pageW, pageH, 'F');
  pdf.setFillColor(13,148,136); pdf.rect(0, pageH-9, pageW, 9, 'F');
  pdf.setFillColor(109,40,217); pdf.rect(0, pageH-9, pageW*0.62, 9, 'F');
  pdf.setTextColor(224,214,250); pdf.setFont(undefined,'bold'); pdf.setFontSize(10.5);
  pdf.text('INFORME CONFIDENCIAL', 20, 28);
  pdf.setTextColor(255,255,255); pdf.setFont(undefined,'bold'); pdf.setFontSize(30);
  pdf.text('Dashboard Organizacional de', 20, 52);
  pdf.text('Liderazgo 360°', 20, 65);
  pdf.setFont(undefined,'normal'); pdf.setFontSize(14); pdf.setTextColor(224,214,250);
  pdf.text(`${DATA.meta.medicion}  ·  ${DATA.meta.cliente}`, 20, 78);
  pdf.setDrawColor(255,255,255); pdf.setLineWidth(0.4); pdf.line(20, 95, pageW-20, 95);
  const items = [
    [String(k.n_lideres), 'Líderes evaluados'], [String(k.n_evaluadores), 'Evaluadores'],
    [k.n_respuestas.toLocaleString('es-CO'), 'Respuestas analizadas'],
    [fmt(k.puntaje_otros), 'Resultado global (Otros)'], [fmt(k.puntaje_auto), 'Autoevaluación promedio'],
  ];
  let x = 20; const y = 118;
  items.forEach(([val,label])=>{
    pdf.setFont(undefined,'bold'); pdf.setFontSize(24); pdf.setTextColor(255,255,255);
    pdf.text(val, x, y);
    pdf.setFont(undefined,'normal'); pdf.setFontSize(9); pdf.setTextColor(224,214,250);
    pdf.text(pdf.splitTextToSize(label, 48), x, y+7);
    x += 53;
  });
  pdf.setFont(undefined,'normal'); pdf.setFontSize(9); pdf.setTextColor(224,214,250);
  const today = new Date().toLocaleDateString('es-CO', { year:'numeric', month:'long', day:'numeric' });
  pdf.text('Generado el ' + today, 20, pageH-20);
  pdf.text(`Escala de valoración: ${DATA.escala.min} – ${DATA.escala.max}`, 20, pageH-15);
}
async function generateFullPdf(){
  const btn = document.getElementById('btn-download-pdf');
  if(!window.jspdf || !window.html2canvas){ alert('No se pudieron cargar las librerías de exportación.'); return; }
  const origBtnText = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparando…';
  document.querySelectorAll('.dl-btn').forEach(b=> b.style.visibility = 'hidden');
  // Ocultar botones JPEG también en pestañas que se renderizan durante la exportación
  document.body.classList.add('pdf-export');
  // Sin animación: los gráficos se capturan ya terminados (con las barras a su altura real)
  const prevAnim = Chart.defaults.animation;
  Chart.defaults.animation = false;
  Object.values(Chart.instances).forEach(ch=>{ ch.options.animation = false; ch.update('none'); });
  const origActiveTab = document.querySelector('.tab-btn.active')?.dataset.tab || 'resumen';
  const filterIds = ['filter-comp-tema','filter-behav-tema','filter-behav-n','filter-behav-tbl-tema','filter-heat-tema','filter-demo-field'];
  const origFilters = {};
  filterIds.forEach(id=>{ const el = document.getElementById(id); if(el) origFilters[id] = el.value; });

  try{
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4', compress:true });
    const cfg = { marginX:10, marginY:14, contentW:277, contentH:182 };
    drawCoverPage(pdf);

    for(let i=0;i<TABS.length;i++){
      const tab = TABS[i];
      btn.textContent = `Generando… ${i+1}/${TABS.length}`;
      document.querySelectorAll('.tab-panel').forEach(p=>{ p.style.display = (p.id==='panel-'+tab.id) ? 'block' : 'none'; });
      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      if(!rendered.has(tab.id)){ RENDERERS[tab.id](); rendered.add(tab.id); }

      if(tab.id === 'competencias'){ const fc=document.getElementById('filter-comp-tema'); if(fc){ fc.value='Todas'; drawCompChart('Todas'); } }
      if(tab.id === 'comportamientos'){
        const fbt=document.getElementById('filter-behav-tema'); if(fbt) fbt.value='Todas';
        const fbn=document.getElementById('filter-behav-n'); if(fbn) fbn.value='15';
        drawBehavChart();
        const fbtt=document.getElementById('filter-behav-tbl-tema'); if(fbtt){ fbtt.value='Todas'; drawBehavTable('Todas'); }
      }
      if(tab.id === 'perspectiva'){ const fht=document.getElementById('filter-heat-tema'); if(fht){ fht.value='Todas'; drawBehavHeatmap(); } }

      await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
      await new Promise(r=>setTimeout(r, 350));

      pdf.addPage();
      let cursorY = cfg.marginY;
      const panel = document.getElementById('panel-'+tab.id);
      const heading = panel.querySelector('.section-title')?.textContent?.trim() || tab.label;
      pdf.setFont(undefined,'bold'); pdf.setFontSize(15); pdf.setTextColor(76,29,149);
      pdf.text(heading, cfg.marginX, cursorY);
      cursorY += 6;
      pdf.setDrawColor(224,224,230); pdf.setLineWidth(0.3);
      pdf.line(cfg.marginX, cursorY, cfg.marginX+cfg.contentW, cursorY);
      cursorY += 6;
      pdf.setFont(undefined,'normal');

      // En Demográfico el PDF incluye TODOS los campos (uno tras otro), no solo el seleccionado
      const passes = (tab.id==='demografico' && HAS_DEMO) ? DATA.demographic_fields.map(f=>f.key) : [null];
      for(let pi=0; pi<passes.length; pi++){
        if(passes[pi]){
          drawDemoSelected(passes[pi]);
          await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
          await new Promise(r=>setTimeout(r, 350));
        }
        const blocks = flattenPdfBlocks(panel);
        for(const block of blocks){
          if(block.classList.contains('section-title')) continue;
          if(block.id === 'demo-selector-card') continue;
          if(block.classList.contains('section-desc')){
            if(pi>0) continue;
            pdf.setFontSize(9); pdf.setTextColor(107,114,128);
            const lines = pdf.splitTextToSize(block.textContent.trim(), cfg.contentW);
            if(cursorY + lines.length*4 > cfg.marginY+cfg.contentH){ pdf.addPage(); cursorY = cfg.marginY; }
            pdf.text(lines, cfg.marginX, cursorY);
            cursorY += lines.length*4 + 4;
            continue;
          }
          if(block.classList.contains('dim-group-title') && cursorY + 60 > cfg.marginY + cfg.contentH){ pdf.addPage(); cursorY = cfg.marginY; }
          const table = block.querySelector('table');
          if(table){ cursorY = await renderTableBlockToPdf(pdf, block, table, cfg, cursorY); }
          else { cursorY = await renderGenericBlockToPdf(pdf, block, cfg, cursorY); }
        }
      }
    }
    pdf.save(`Dashboard_Liderazgo360_${slugify(DATA.meta.cliente)}.pdf`);
  } catch(err){
    console.error('Error generando PDF:', err);
    alert('Hubo un problema generando el PDF. Por favor intenta de nuevo.');
  } finally {
    document.querySelectorAll('.tab-panel').forEach(p=> p.style.display = '');
    activateTab(origActiveTab);
    filterIds.forEach(id=>{ const el=document.getElementById(id); if(el && origFilters[id]!==undefined) el.value = origFilters[id]; });
    if(document.getElementById('filter-comp-tema')) drawCompChart(document.getElementById('filter-comp-tema').value);
    if(document.getElementById('filter-behav-tema')) drawBehavChart();
    if(document.getElementById('filter-behav-tbl-tema')) drawBehavTable(document.getElementById('filter-behav-tbl-tema').value);
    if(document.getElementById('filter-heat-tema')) drawBehavHeatmap();
    if(document.getElementById('filter-demo-field')) drawDemoSelected(document.getElementById('filter-demo-field').value);
    document.querySelectorAll('.dl-btn').forEach(b=> b.style.visibility = '');
    document.body.classList.remove('pdf-export');
    Chart.defaults.animation = prevAnim;
    btn.disabled = false; btn.textContent = origBtnText;
  }
}

window.generateFullPdf = generateFullPdf;
window.downloadAsJpeg = downloadAsJpeg;

  }

  fetch(API + '?survey=' + encodeURIComponent(SURVEY), {
    credentials: 'same-origin',
    headers: { 'X-Frappe-CSRF-Token': (window.csrf_token || ''), 'Accept': 'application/json' }
  })
  .then(function(res){
    if(res.status === 403) throw new Error('No tienes permiso para ver este dashboard. Inicia sesión con un usuario autorizado.');
    return res.json().then(function(j){ if(!res.ok) throw new Error(parseErr(j)); return j; });
  })
  .then(function(j){
    var DATA = j.message;
    if(!DATA || !DATA.kpis){ throw new Error('La medición no tiene respuestas disponibles.'); }
    document.getElementById('m-sub').textContent = DATA.meta.titulo + (DATA.meta.cliente && DATA.meta.cliente !== DATA.meta.medicion ? ' · ' + DATA.meta.cliente : '');
    document.getElementById('m-footer').textContent = 'Dashboard generado a partir de ' + DATA.meta.medicion + '. Los resultados "Otros" agrupan Jefe + Pares + Colaboradores como promedio simple de respuestas individuales.';
    state.style.display = 'none';
    document.getElementById('ll-app').style.display = '';
    boot(DATA);
  })
  .catch(function(err){ console.error(err); fail(err.message || 'Ocurrió un error cargando los datos.'); });

  function parseErr(j){
    try {
      if(j._server_messages){ var m = JSON.parse(JSON.parse(j._server_messages)[0]); return (m.message || '').replace(/<[^>]+>/g,''); }
      if(j.exception) return String(j.exception).split(': ').slice(1).join(': ') || j.exception;
    } catch(e) {}
    return 'Error al cargar los datos';
  }
})();
