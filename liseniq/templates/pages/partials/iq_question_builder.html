{% if not is_edit_mode %}
<div class="mt-4 mb-5">
    <span class="tooltip-wrapper" style="margin-left:4px;">
        <button id="btn-open-question-bank" data-tooltip-bottom="Colección de preguntas disponibles para usar en la creación de plantillas y mediciones. Puedes reutilizar preguntas existentes, filtrarlas por categoría o tema y agregarlas fácilmente a tus encuestas." class="btn btn-purple-main">Ver Biblioteca de preguntas</button>
        <span class="tooltip-icon"></span>
    </span>
</div>
{% endif %}

<div id="questions-list" class="questions-list"></div>

{% if not is_edit_mode %}
<div class="add-question-form mt-4">

    <div class="row">
        <div class="col-12">
            <span class="tooltip-wrapper" style="margin-left:4px;">
            <label data-tooltip-bottom="Es la formulación de la pregunta que verán los participantes al responder la medición. Debe ser clara, directa y fácil de entender para obtener respuestas precisas." for="new_question_text" class="small text-muted">Ingresa tu pregunta</label>
            <span class="tooltip-icon" style="margin-bottom: 0.5rem;"></span>
        </span>
            <input type="text" class="form-control" id="new_question_text" placeholder="Ingresa el enunciado de la pregunta...">
            <small id="new_question_text_error" class="form-error-message d-none">Este campo es requerido.</small>
        </div>
    </div>

    <div id="leadership-statement-container" class="form-group d-none mt-3">
        <span class="tooltip-wrapper" style="margin-left:4px;">
            <label data-tooltip-bottom="Es la formulación de la pregunta que verán los participantes al responder la medición. Debe ser clara, directa y fácil de entender para obtener respuestas precisas." for="new_question_text_others" class="small text-muted">Texto de la Pregunta / Enunciado Evaluadores</label>
            <span class="tooltip-icon" style="margin-bottom: 0.5rem;"></span>
        </span>
        <p class="text-muted small mb-1">Este enunciado lo verán los pares, reportes y jefes.</p>
        <input type="text" class="form-control" id="new_question_text_others" placeholder="Ej: Fomenta el desarrollo de su equipo...">
        <small id="new_question_text_others_error" class="form-error-message d-none"></small>
    </div>

    <div class="row mt-3">
        <div class="col-md-6">
            <span class="tooltip-wrapper" style="margin-left:4px;">
                <label data-tooltip-bottom="Define la forma en la que el participante podrá responder la pregunta: opción múltiple, likert, abiertas, texto corto, selección múltiple, entre otros. Selecciona el tipo que mejor se ajuste al dato que deseas recoger." for="new_question_type" class="small text-muted">Tipo de respuesta</label>
                <span class="tooltip-icon" style="margin-bottom: 0.5rem;"></span>
            </span>
            <select class="form-control form-select" id="new_question_type">
                <option selected value="">Selecciona el tipo de respuesta</option>
                {% for type in question_types %}
                <option value="{{ type.name }}">{{ type.qnt_type_name }}</option>
                {% endfor %}
            </select>
             <small id="new_question_type_error" class="form-error-message d-none">Este campo es requerido.</small>
        </div>
        <div class="col-md-6">
            <div class="form-group" style="position: relative;">
                <span class="tooltip-wrapper" style="margin-left:4px;">
                    <label data-tooltip-bottom="Etiqueta que clasifica la pregunta según su contenido (por ejemplo: liderazgo, comunicación, clima, servicio al cliente, etc.). Facilita la organización y análisis de los datos." for="new_question_demographic" class="small text-muted">Tema</label>
                    <span class="tooltip-icon" style="margin-bottom: 0.5rem;"></span>
                </span>
                <input type="text" class="form-control" id="new_question_demographic" placeholder="Buscar o crear tema..." autocomplete="off">
                <div class="autocomplete-results"></div>
                <small id="new_question_demographic_error" class="form-error-message d-none"></small>
            </div>
        </div>
    </div>

    <div id="options-based-section" class="mt-4 d-none">
        <label class="small text-muted">Opciones de respuesta</label>
        <div id="options-container">
            <div class="option-input-row">
                <span class="option-number">1</span>
                <input type="text" class="form-control option-input" placeholder="Escribe tu opción aqui">
                <i class="fa fa-trash-o text-danger delete-option" style="cursor: pointer;"></i>
            </div>
        </div>
        <button id="btn-add-option" class="btn btn-sm btn-add-option mt-3">
            <i class="fa fa-plus-circle"></i>
        </button>
    </div>

    <div id="visual-options-section" class="mt-4 d-none">
        <label class="small text-muted">Opciones de respuesta (Likert Visual)</label>
        <div id="visual-options-container">
            <div class="visual-option-input-row">
                <span class="option-number">1</span>
                <input type="text" class="form-control visual-option-value" placeholder="Valor (ej: 5)">
                <input type="text" class="form-control visual-option-text" placeholder="Texto (ej: Excelente)">
                <div class="visual-file-cell">
                    <input type="file" accept="image/*" class="visual-option-file">
                    <input type="hidden" class="visual-option-url-input" value="">
                    <div class="visual-file-preview d-none">
                        <img src="" alt="previsualización">
                        <span class="file-name small text-muted"></span>
                    </div>
                </div>
                <i class="fa fa-trash-o text-danger delete-visual-option" style="cursor: pointer;"></i>
            </div>
        </div>
        <button id="btn-add-visual-option" class="btn btn-sm btn-add-option mt-3" title="Agregar opción visual">
            <i class="fa fa-plus-circle"></i>
        </button>
    </div>

    <div id="bipolar-scale-section" class="bipolar-scale-section d-none">
        <label class="small text-muted">Enunciados de la escala</label>
        <div class="row">
            <div class="col-md-6">
                <label for="negative_statement_input" class="small">Extremo Negativo (ej: Totalmente en desacuerdo)</label>
                <input type="text" class="form-control" id="negative_statement_input" placeholder="Enunciado para el valor -4">
                <small id="negative_statement_error" class="form-error-message d-none"></small>
            </div>
            <div class="col-md-6">
                <label for="positive_statement_input" class="small">Extremo Positivo (ej: Totalmente de acuerdo)</label>
                <input type="text" class="form-control" id="positive_statement_input" placeholder="Enunciado para el valor 4">
                <small id="positive_statement_error" class="form-error-message d-none"></small>
            </div>
        </div>
    </div>

    <div id="nps-scale-section" class="nps-scale-section d-none">
        <label class="small text-muted">Rango de la Escala NPS</label>
        <div class="row">
            <div class="col-md-6">
                <label for="nps_min_input" class="small">Valor Mínimo</label>
                <input type="number" class="form-control" id="nps_min_input" placeholder="Ej: 1">
                <small id="nps_min_error" class="form-error-message d-none"></small>
            </div>
            <div class="col-md-6">
                <label for="nps_max_input" class="small">Valor Máximo</label>
                <input type="number" class="form-control" id="nps_max_input" placeholder="Ej: 10">
                <small id="nps_max_error" class="form-error-message d-none"></small>
            </div>
        </div>
    </div>

</div>
<div class="text-center mt-5">
    <button id="btn-add-question" class="btn btn-outline-purple">Agregar Pregunta</button>
</div>

<div id="question-bank-modal" class="question-bank-modal-overlay d-none">
    <div class="question-bank-modal-content">
        <div class="modal-header">
            <h5 class="modal-title">Banco de preguntas</h5>
            <button type="button" class="close" id="btn-close-modal" aria-label="Cerrar">
                <span aria-hidden="true">&times;</span>
            </button>
        </div>
        <div class="modal-body">
            <div class="modal-sidebar">
                <ul id="bank-category-filter-list" class="list-unstyled bank-category-list"></ul>
            </div>
            <div class="modal-questions-list">
                <div class="search-bar">
                    <h6 class="search-bar-title"># Buscar Pregunta</h6>
                    <input type="text" id="bank-search-input" class="form-control" placeholder="Escribe para buscar...">
                </div>
                <div id="bank-questions-container" class="questions-container"></div>
            </div>
            <div class="modal-selected-questions">
                <div class="selected-questions-header">
                    <h6 class="font-weight-bold">Preguntas seleccionadas</h6>
                </div>
                <div id="modal-selected-questions-container" class="selected-questions-container"></div>
                <div class="modal-footer">
                    <button id="btn-add-selected-questions" class="btn btn-purple-main" disabled>Agregar preguntas</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
